<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Administration — Berceau Communautaire</title>
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="admin.css">
    </head>
    <body class="admin-body">
        <!-- Navigation de l’administration -->
        <aside class="admin-sidebar">
            <a class="brand admin-brand" href="index.html">
                <span class="brand-mark">BC</span>
                <span>
                    Berceau
                    <b>Administration</b>
                </span>
            </a>
            <nav>
                <button class="active" data-view="dashboard">
                    <i class="fa-solid fa-chart-pie"></i>
                    Tableau de bord
                </button>
                <button data-view="news">
                    <i class="fa-regular fa-newspaper"></i>
                    Actualités
                </button>
                <button data-view="professionals">
                    <i class="fa-solid fa-user-group"></i>
                    Professionnels
                </button>
                <button data-view="commerces">
                    <i class="fa-solid fa-store"></i>
                    Commerces
                </button>
                <button data-view="certifications">
                    <i class="fa-solid fa-certificate"></i>
                    Certifications
                </button>
            </nav>
            <a class="back-site" href="ntani-admin.html">Postes Ntani · registre local</a>
            <a class="back-site" href="index.html">
                <i class="fa-solid fa-arrow-left"></i>
                Retour au site
            </a>
        </aside>
        <!-- Espace de gestion -->
        <main class="admin-main">
            <header class="admin-top">
                <button id="admin-menu" aria-label="Menu">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div>
                    <span class="meta">ESPACE DE GESTION</span>
                    <h1 id="view-title" tabindex="-1">Tableau de bord</h1>
                </div>
                <div class="admin-avatar">AD</div>
            </header>
            <div class="notice admin-warning">
                <b>Prototype local :</b>
                aucune authentification sécurisée n’est configurée. Protégez cette route avec un backend et une gestion de sessions avant toute mise en production.
            </div>
            <p id="admin-feedback" class="notice" role="status" aria-live="polite" hidden></p>
            <section id="admin-view"></section>
        </main>
        <div id="admin-modal" class="modal">
            <div class="modal-card">
                <button class="modal-close" aria-label="Fermer">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <div class="modal-content"></div>
            </div>
        </div>
        <script src="data.js"></script>
        <script src="admin.js"></script>
    </body>
</html>
