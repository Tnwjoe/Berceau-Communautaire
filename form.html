<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nous écrire — Berceau Communautaire</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">BC</span><span>Berceau <b>Communautaire</b></span></a><nav class="main-nav"><a href="index.html">Retour à l’accueil</a></nav></header><main><section class="page-hero"><div class="wrap"><span class="eyebrow">Votre voix compte</span><h1>Parlons de votre quartier.</h1><p>Une remarque, une information utile ou une idée ? Écrivez-nous.</p></div></section><form class="feedback" id="avisForm"><div class="form-grid"><div><label for="nom">Nom</label><input id="nom" required></div><div><label for="email">E-mail</label><input id="email" type="email"></div><div class="full"><label for="message">Message</label><textarea id="message" required></textarea></div><div class="full"><button class="btn primary" type="submit">Envoyer le message</button></div></div><p id="resultat" class="notice" hidden></p></form></main><script>document.querySelector('#avisForm').onsubmit=e=>{e.preventDefault();const r=document.querySelector('#resultat');r.hidden=false;r.textContent='Merci ! Votre message a bien été préparé pour traitement.';e.target.reset()}</script></body></html>
